# deploy/nginx.conf — nginx del contenedor (nginx_proxy le quita el prefijo /dev/)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA - manejar rutas client-side bajo /dev/
    location /dev/ {
        try_files $uri $uri/ /dev/index.html;
    }

    # Cache para assets bajo /dev/
    location ~* /dev/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Evita errores con favicons o robots.txt en la raíz
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt { access_log off; log_not_found off; }
}

